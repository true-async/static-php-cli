ext-server:
  type: php-extension
  artifact:
    source:
      type: git
      url: 'https://github.com/true-async/server.git'
      rev: main
      extract: php-src/ext/server
    metadata:
      license-files: [LICENSE]
      license: PHP-3.01
  depends:
    - ext-async
    - openssl
    - nghttp2
  suggests:
    - nghttp3
    - ngtcp2
  php-extension:
    # The module registers itself as "true_async_server", not "server".
    display-name: true_async_server
    os:
      - Linux
      - Darwin
    arg-type@unix: custom
