ext-async:
  type: php-extension
  artifact:
    source:
      type: git
      url: 'https://github.com/true-async/php-async.git'
      rev: main
      extract: php-src/ext/async
    metadata:
      license-files: [LICENSE]
      license: PHP-3.01
  depends:
    - libuv
    - ext-sockets
  php-extension:
    os:
      - Linux
      - Darwin
