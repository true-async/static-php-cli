ext-async:
  type: php-extension
  artifact:
    source:
      type: git
      url: 'https://github.com/true-async/php-async.git'
      rev: main
      extract: php-src/ext/async
    metadata:
      license-files: [LICENSE]
      license: PHP-3.01
  depends:
    - libuv
    - ext-sockets
  php-extension:
    # The module registers itself as "true_async", not "async", so the
    # post-build `php --ri` smoke test must look it up under that name.
    display-name: true_async
    os:
      - Linux
      - Darwin
